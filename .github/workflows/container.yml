name: Publish containers

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Fornix image metadata
        id: fornix-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Fornix image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.fornix-meta.outputs.tags }}
          labels: ${{ steps.fornix-meta.outputs.labels }}

      - name: Extract watcher image metadata
        id: watcher-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-watcher
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push watcher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.watcher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.watcher-meta.outputs.tags }}
          labels: ${{ steps.watcher-meta.outputs.labels }}
