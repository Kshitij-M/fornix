name: fornix-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fornix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - name: Check Go formatting
        run: make fmt-check
      - name: Run unit tests
        run: make test
      - name: Run domain-neutral contract tests
        run: go test ./internal/contracts -run '^TestDomainNeutral' -count=1 -v
      - name: Run multi-domain reference workflow qualification
        run: make qualification-multidomain-reference
      - name: Run generic workflow qualification
        run: make qualification-generic-workflow
      - name: Run generic effect verification qualification
        run: make qualification-generic-effect-verification
      - name: Run connector registry conformance tests
        run: make test-connectors
      - name: Run credential lease and capability trust tests
        run: make smoke-universal-trust
      - name: Run shared destination policy tests
        run: make smoke-universal-egress
      - name: Run external-effect reconciliation tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-effects
      - name: Run generic effect verification Postgres qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-generic-effect-verification-postgres
      - name: Run race tests
        run: make test-race
      - name: Run vet
        run: make vet
      - name: Build binaries
        run: make build
      - name: Check release and qualification scripts
        run: make package-check
      - name: Run deterministic built-in adapter qualification matrix
        run: make qualification-adapter-matrix
      - name: Run deterministic effect-adapter conformance inventory
        run: make qualification-effect-conformance
      - name: Run external-boundary conformance inventory
        run: make qualification-external-boundary
      - name: Generate and validate portable qualification bundle
        run: make qualification-offline
      - name: Validate authority observation qualification seam
        run: make qualification-effect-observation
      - name: Validate signed qualification import seam
        run: make qualification-signed
      - name: Smoke test the packaged CLI contract
        run: make smoke-local-cli
      - name: Qualify redacted support-bundle output
        run: make qualification-support-bundle
      - name: Qualify trusted agent tool-schema projection
        run: make qualification-agent-tool-schema-authority
      - name: Validate installer shell syntax
        run: sh -n scripts/install.sh

  python:
    name: Python helper checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Check Python helpers
        run: make python-check
      - name: Check documentation
        run: make docs-check

  integration:
    name: Postgres and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: fornix
          POSTGRES_USER: fornix
          POSTGRES_PASSWORD: fornix-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fornix -d fornix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Build Fornix and operator CLI
        run: |
          go build -trimpath -o /tmp/fornix ./cmd/fornix
          mkdir -p bin
          cp /tmp/fornix bin/fornix
      - name: Run durable generic connector execution tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-execution
      - name: Run authorization audit replay qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-authorization-audit-postgres
      - name: Run durable capability rate-admission qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-capability-rate-admission-postgres
      - name: Run workflow retry-deadline qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-workflow-retry-deadline-postgres
      - name: Run agent-loop trust-boundary persistence qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-agent-trust-boundary-postgres
      - name: Run stale agent-run effect-dispatch fencing qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-agent-run-effect-dispatch-postgres
      - name: Start Fornix
        env:
          FORNIX_AUTH_MODE: development
          FORNIX_WORKER_ENABLED: "false"
          # Compatibility smoke only; production defaults keep legacy global
          # federation/router tables quarantined until they are workspace-scoped.
          FORNIX_ENABLE_LEGACY_GLOBAL_SURFACES: "true"
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_LISTEN: :8201
        run: |
          /tmp/fornix >/tmp/fornix.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8201/readyz && exit 0
            sleep 1
          done
          cat /tmp/fornix.log
          exit 1
      - name: Run bounded generic-operation capacity qualification
        env:
          FORNIX_CAPACITY_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_CAPACITY_OPERATIONS: '64'
          FORNIX_CAPACITY_WORKERS: '4'
          FORNIX_CAPACITY_MAX_P95_MS: '2000'
        run: make qualification-capacity
      - name: Run non-owner PostgreSQL workspace-isolation qualification
        env:
          PGPASSWORD: fornix-ci
          FORNIX_RLS_ADMIN_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix_rls_ci?sslmode=disable
          FORNIX_RLS_TEST_DSN: postgres://fornix_rls_ci:fornix-rls-ci@localhost:5432/fornix_rls_ci?sslmode=disable
          FORNIX_RLS_APP_ROLE: fornix_rls_ci
          FORNIX_RLS_MIGRATION_ROLE: fornix_migrator
        run: |
          psql -h localhost -U fornix -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS fornix_rls_ci"
          psql -h localhost -U fornix -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS fornix_rls_ci"
          psql -h localhost -U fornix -d postgres -v ON_ERROR_STOP=1 -c "DROP ROLE IF EXISTS fornix_migrator"
          psql -h localhost -U fornix -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE fornix_rls_ci LOGIN PASSWORD 'fornix-rls-ci' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U fornix -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE fornix_migrator NOLOGIN NOSUPERUSER NOBYPASSRLS"
          createdb -h localhost -U fornix -O fornix fornix_rls_ci
          FORNIX_TEST_PG_DSN="$FORNIX_RLS_ADMIN_DSN" go test ./internal/store -run '^TestOperationIntegrationCreateDuplicateConflictAndLinks$' -count=1 -v
          FORNIX_RLS_ADMIN_DSN="$FORNIX_RLS_ADMIN_DSN" FORNIX_RLS_TEST_DSN="$FORNIX_RLS_TEST_DSN" FORNIX_RLS_APP_ROLE="$FORNIX_RLS_APP_ROLE" FORNIX_RLS_MIGRATION_ROLE="$FORNIX_RLS_MIGRATION_ROLE" make qualification-role-separated-postgres
          FORNIX_RLS_TEST_DSN="$FORNIX_RLS_TEST_DSN" make qualification-workspace-isolation
      - name: Run baseline smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          PYTHON_BIN: python
        run: scripts/test/v0.10-smokes.sh
      - name: Run event-store integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run TestEventStore -count=1 -v
      - name: Run qualification trust catalog integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-trust
      - name: Run qualification trust distribution integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-trust-distribution
      - name: Run deployment evidence gate integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-deployment-evidence
      - name: Run deployment qualification refresh integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-deployment-refresh
      - name: Run deployment qualification refresh scheduler integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-deployment-refresh-scheduler
      - name: Run release admission verification integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-release-admission
      - name: Run generic operation admission-reference integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make qualification-admission-reference
      - name: Run projection integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/projection -run TestRunner -count=1 -v
      - name: Run consumer lease and fencing integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/projection -run 'TestConsumerLease|TestRunnerStaleLease|TestRunnerConcurrentConsumers' -count=1 -v
      - name: Run control-plane event smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.11-event-smokes.sh
      - name: Run task execution smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_TASK_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.14-task-smokes.sh
      - name: Run task creation idempotency integration test
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestTaskCreateIdempotency' -count=1 -v
      - name: Run retrieval integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/retrieval -run '^Test(Retrieve|Plan|Compiler)' -count=1 -v
      - name: Run retrieval smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_RETRIEVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.15-retrieval-smokes.sh
      - name: Run provenance and disclosure integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^Test(Evidence|EventAppendCreates)' -count=1 -v
      - name: Run provenance and disclosure smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_PROVENANCE_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.16-provenance-smokes.sh
      - name: Run model gateway integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestModelCallStore' -count=1 -v
      - name: Run model gateway smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.17-model-smokes.sh
      - name: Run tool execution integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestToolRunStore' -count=1 -v
      - name: Run tool registry and execution smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.18-tool-smokes.sh
      - name: Run deterministic agent-loop integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/agentloop -run 'Test(AgentRunStore|Run)' -count=1 -v
      - name: Run deterministic agent-loop smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.19-agent-smokes.sh
      - name: Run durable agent-run scheduler integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/scheduler -run 'TestAgentRunScheduler|TestWorker' -count=1 -v
      - name: Run durable agent-run scheduler smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.20-scheduler-smokes.sh
      - name: Run agent-run fenced model and tool effect tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/agentloop ./internal/model ./internal/tool ./internal/store -run 'Test(AgentRunLease|ModelRequestAgentRun|ToolRequestAgentRun|ModelCallStoreAgentRun|ToolRunStoreAgentRun)' -count=1 -v
      - name: Run identity and authorization integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/server -run 'Test(AuthStore|SecurityMiddleware)' -count=1 -v
      - name: Run identity and authorization smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.21-identity-smokes.sh
      - name: Run artifact storage integration tests and smoke
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestArtifactStore|^TestModelCallStoreTerminal' -count=1 -v
      - name: Run artifact storage smoke
        env:
          FORNIX_ARTIFACT_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.22-artifact-smokes.sh
      - name: Run artifact-backed output integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run 'Test(ArtifactBacked|Oversized|ArtifactBackfill|EvidenceBackfill|AgentBackfill|ArtifactRetentionSweep)' -count=1 -v
      - name: Run artifact-backed output smoke
        env:
          FORNIX_ARTIFACT_OUTPUT_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.23-artifact-output-smokes.sh
      - name: Run observability and offline evaluation integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/eval -run 'Test(Observability|ModelUsage|Evaluation|Replay)' -count=1 -v
      - name: Run observability and evaluation smoke
        env:
          FORNIX_OBSERVABILITY_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.24-observability-smokes.sh
      - name: Run retrieval quality integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/eval -run 'Test(EvaluateRetrievalDataset|ScoreRankedEvidence|RetrievalGates)' -count=1 -v
      - name: Run retrieval quality smoke
        env:
          FORNIX_EVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.25-retrieval-quality-smokes.sh
      - name: Run retrieval-surface capture integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/store -run 'TestRetrievalSurface' -count=1 -v
      - name: Run retrieval evaluation API and CLI smoke
        env:
          FORNIX_RETRIEVAL_EVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.26-retrieval-evaluation-smokes.sh
      - name: Run operator reference workflow smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.27-reference-workflow-smokes.sh
      - name: Run resumable repository ingestion integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/ingest ./internal/store -run 'Test(Ingest|Discover|Chunks|ReadAndVerify)' -count=1 -v
      - name: Run resumable repository ingestion smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.29-ingestion-smokes.sh
      - name: Run Work Receipt integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/server ./internal/store -run 'Test(WorkReceipt|SecurityMiddlewareAuthorizesWorkReceiptSurface)' -count=1 -v
      - name: Run Work Receipt smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.30-work-receipt-smokes.sh
      - name: Run repository change integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/change ./internal/store -run 'Test(RepositoryChange|Change|ArtifactStore)' -count=1 -v
      - name: Run repository change smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.31-change-smokes.sh
      - name: Run post-change validation integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/validation -run 'Test(Validation|DefaultRegistry|Registry|ObserveApplied)' -count=1 -v
      - name: Run post-change validation smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.32-validation-smokes.sh
      - name: Run validation policy integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/policy ./internal/server ./internal/store -run 'Test(Policy|SecurityMiddleware.*Policy)' -count=1 -v
      - name: Run validation policy smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.33-policy-smokes.sh
      - name: Run universal operation admission and effect integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/policy ./internal/store -run 'TestAdmission|TestOperation' -count=1 -v
      - name: Run universal reference connector tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: |
          go test ./internal/connector ./internal/adapters/httpapi ./internal/adapters/sqlreadonly -count=1 -v
          go test ./internal/store -run 'TestConnectorBinding' -count=1 -v
      - name: Run durable generic workflow runtime tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/store ./internal/workflow -run 'Test(Workflow|Runtime)' -count=1 -v
      - name: Run adapter-owned generic operation worker qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/operationworker ./internal/store -run 'TestWorker|TestOperationQueue' -count=1 -v
      - name: Run server-composed read-only operation worker qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/server ./internal/store -run 'TestServerOperationWorker|TestOperationQueueReadOnlyFilter' -count=1 -v

      - name: Run universal operation supervisor qualification
        run: go test ./internal/operationsupervisor -run '^TestSupervisor' -count=1 -v
      - name: Run multi-domain incident workflow integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/adapters/fakeincident ./internal/workflows/incident -run 'Test(Incident|Connector)' -count=1 -v
      - name: Run multi-domain incident workflow smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.38-multidomain-smokes.sh
      - name: Run universal operation HTTP and authorization qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/server -run 'Test(GenericOperationHTTP|SecurityMiddleware.*GenericOperation)' -count=1 -v
      - name: Run universal external-effect reconciliation qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-effects
      - name: Run shared durable effect dispatcher qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-effect-dispatch
      - name: Run scoped embedding authority qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-embeddings
      - name: Run universal effect-authority linkage qualification
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: make smoke-universal-effect-authority
      - name: Run effect-authority adapter conformance qualification
        run: make smoke-universal-authority-conformance
      - name: Run universal operation CLI smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_WORKSPACE_ID: universal-operation-ci
        run: scripts/test/v0.39-universal-operation-smokes.sh

  local-runtime:
    name: Managed local runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build the CLI used by the runtime smoke
        run: |
          mkdir -p bin
          go build -trimpath -o bin/fornix ./cmd/fornix
      - name: Build the local Fornix image
        run: docker build --tag fornix-local:ci .
      - name: Run the disposable CLI/runtime workflow
        env:
          FORNIX_LOCAL_IMAGE: fornix-local:ci
          FORNIX_RUNTIME_PROJECT: fornix-local-ci
          FORNIX_LOCAL_PORT: '18281'
        run: scripts/test/v0.35-local-runtime-smokes.sh

  package:
    name: Package and installer checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Syft for archive SBOMs
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.42.3
      - name: Add Syft to PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"
      - name: Build and test the clean-room installer path
        run: make smoke-package
      - name: Build the complete cross-platform release matrix
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify release archives, checksums, notices, and paths
        run: sh scripts/release/verify-artifacts.sh --require-matrix dist

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      # Pin the scanner to the project's supported Go line. Using @latest
      # makes a green repository fail when the scanner raises its own Go
      # requirement before it can inspect Fornix.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
