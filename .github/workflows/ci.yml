name: fornix-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fornix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - name: Check Go formatting
        run: make fmt-check
      - name: Run unit tests
        run: make test
      - name: Run race tests
        run: make test-race
      - name: Run vet
        run: make vet
      - name: Build binaries
        run: make build

  python:
    name: Python helper checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Check Python helpers
        run: make python-check
      - name: Check documentation
        run: make docs-check

  integration:
    name: Postgres and HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: fornix
          POSTGRES_USER: fornix
          POSTGRES_PASSWORD: fornix-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fornix -d fornix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement scripts/requirements.txt
      - name: Build Fornix and operator CLI
        run: |
          go build -trimpath -o /tmp/fornix ./cmd/fornix
          mkdir -p bin
          cp /tmp/fornix bin/fornix
      - name: Start Fornix
        env:
          FORNIX_AUTH_MODE: development
          FORNIX_WORKER_ENABLED: "false"
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_LISTEN: :8201
        run: |
          /tmp/fornix >/tmp/fornix.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://localhost:8201/readyz && exit 0
            sleep 1
          done
          cat /tmp/fornix.log
          exit 1
      - name: Run baseline smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          PYTHON_BIN: python
        run: scripts/test/v0.10-smokes.sh
      - name: Run event-store integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run TestEventStore -count=1 -v
      - name: Run projection integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/projection -run TestRunner -count=1 -v
      - name: Run consumer lease and fencing integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/projection -run 'TestConsumerLease|TestRunnerStaleLease|TestRunnerConcurrentConsumers' -count=1 -v
      - name: Run control-plane event smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.11-event-smokes.sh
      - name: Run task execution smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_TASK_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.14-task-smokes.sh
      - name: Run retrieval integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/retrieval -run '^Test(Retrieve|Plan|Compiler)' -count=1 -v
      - name: Run retrieval smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_RETRIEVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.15-retrieval-smokes.sh
      - name: Run provenance and disclosure integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^Test(Evidence|EventAppendCreates)' -count=1 -v
      - name: Run provenance and disclosure smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_PROVENANCE_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.16-provenance-smokes.sh
      - name: Run model gateway integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestModelCallStore' -count=1 -v
      - name: Run model gateway smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.17-model-smokes.sh
      - name: Run tool execution integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestToolRunStore' -count=1 -v
      - name: Run tool registry and execution smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.18-tool-smokes.sh
      - name: Run deterministic agent-loop integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/agentloop -run 'Test(AgentRunStore|Run)' -count=1 -v
      - name: Run deterministic agent-loop smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.19-agent-smokes.sh
      - name: Run durable agent-run scheduler integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/scheduler -run 'TestAgentRunScheduler|TestWorker' -count=1 -v
      - name: Run durable agent-run scheduler smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.20-scheduler-smokes.sh
      - name: Run identity and authorization integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/server -run 'Test(AuthStore|SecurityMiddleware)' -count=1 -v
      - name: Run identity and authorization smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.21-identity-smokes.sh
      - name: Run artifact storage integration tests and smoke
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run '^TestArtifactStore|^TestModelCallStoreTerminal' -count=1 -v
      - name: Run artifact storage smoke
        env:
          FORNIX_ARTIFACT_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.22-artifact-smokes.sh
      - name: Run artifact-backed output integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store -run 'Test(ArtifactBacked|Oversized|ArtifactBackfill|EvidenceBackfill|AgentBackfill|ArtifactRetentionSweep)' -count=1 -v
      - name: Run artifact-backed output smoke
        env:
          FORNIX_ARTIFACT_OUTPUT_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.23-artifact-output-smokes.sh
      - name: Run observability and offline evaluation integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/eval -run 'Test(Observability|ModelUsage|Evaluation|Replay)' -count=1 -v
      - name: Run observability and evaluation smoke
        env:
          FORNIX_OBSERVABILITY_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.24-observability-smokes.sh
      - name: Run retrieval quality integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/eval -run 'Test(EvaluateRetrievalDataset|ScoreRankedEvidence|RetrievalGates)' -count=1 -v
      - name: Run retrieval quality smoke
        env:
          FORNIX_EVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: scripts/test/v0.25-retrieval-quality-smokes.sh
      - name: Run retrieval-surface capture integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/store -run 'TestRetrievalSurface' -count=1 -v
      - name: Run retrieval evaluation API and CLI smoke
        env:
          FORNIX_RETRIEVAL_EVAL_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.26-retrieval-evaluation-smokes.sh
      - name: Run operator reference workflow smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.27-reference-workflow-smokes.sh
      - name: Run resumable repository ingestion integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/ingest ./internal/store -run 'Test(Ingest|Discover|Chunks|ReadAndVerify)' -count=1 -v
      - name: Run resumable repository ingestion smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.29-ingestion-smokes.sh
      - name: Run Work Receipt integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/server ./internal/store -run 'Test(WorkReceipt|SecurityMiddlewareAuthorizesWorkReceiptSurface)' -count=1 -v
      - name: Run Work Receipt smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.30-work-receipt-smokes.sh
      - name: Run repository change integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/change ./internal/store -run 'Test(RepositoryChange|Change|ArtifactStore)' -count=1 -v
      - name: Run repository change smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.31-change-smokes.sh
      - name: Run post-change validation integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/store ./internal/validation -run 'Test(Validation|DefaultRegistry|Registry|ObserveApplied)' -count=1 -v
      - name: Run post-change validation smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
          FORNIX_BOOTSTRAP_KEY: fornix-ci-bootstrap-key
          FORNIX_REFERENCE_WORKDIR: ${{ github.workspace }}/fixtures/reference-repo
        run: scripts/test/v0.32-validation-smokes.sh
      - name: Run validation policy integration tests
        env:
          FORNIX_TEST_PG_DSN: postgres://fornix:fornix-ci@localhost:5432/fornix?sslmode=disable
        run: go test ./internal/contracts ./internal/policy ./internal/server ./internal/store -run 'Test(Policy|SecurityMiddleware.*Policy)' -count=1 -v
      - name: Run validation policy smoke
        env:
          FORNIX_URL: http://localhost:8201
          FORNIX_KEY: fornix-ci-test-key
        run: scripts/test/v0.33-policy-smokes.sh

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
